[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "misaki"
version = "0.9.5"
description = "G2P engine for TTS"
readme = "README.md"
authors = [
    { name = "hexgrad", email = "hello@hexgrad.com" }
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8, <3.14"
dependencies = [
    "addict",
    "pip>=25.0.1", 
    # ^ Spacy needs pip within Python, uv lacks pip by default
    "regex",
]

[project.optional-dependencies]
en = ["num2words", "spacy<4", "spacy-curated-transformers", "phonemizer-fork", "espeakng-loader", "torch", "transformers"]
ja = ["fugashi", "jaconv", "mojimoji", "unidic", "pyopenjtalk"]
ko = ["jamo", "nltk"]
zh = ["jieba", "ordered-set", "pypinyin", "cn2an", "pypinyin-dict"]
vi = ["num2words", "spacy", "spacy-curated-transformers", "underthesea"]
de = ["phonemizer-fork", "espeakng-loader"]
he = ["mishkal-hebrew>=0.3.2; python_version < '3.12'"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
# mishkal-hebrew (the sole [he] dependency) only ships wheels for Python < 3.12.
# This fork targets 3.12 (see .python-version), so constrain universal resolution
# to >= 3.12. Affects only this repo's dev lockfile, not the published package's
# requires-python or optional-dependencies, which consumers still resolve normally.
environments = ["python_version >= '3.12'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
